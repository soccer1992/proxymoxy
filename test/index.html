<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    const blobUrl = URL.createObjectURL(
        new Blob(["<p>text</p>"], { type: "text/html" })
    );
    console.log(blobUrl);
    let meta = document.createElement('meta');
    meta.content = `0;${blobUrl}`;
    meta.httpEquiv = 'refresh'
    document.head.appendChild(meta)
</script>
</body>
</html>
